
services:
  api:
    container_name: APIService
    build: ./api
    ports:
      - '${API_PORT}:80'
    environment:
      API_PORT: ${API_PORT} 
      DB_PORT: ${DB_PORT} 
      DB_USERNAME: ${DB_USERNAME} 
      DB_PASSWORD: ${DB_PASSWORD} 
      DB_NAME: ${DB_NAME}
    volumes:
      - ./api:/api
      - ./models:/models
    depends_on:
      - db

  db:
    container_name: "PGVector"
    image: pgvector/pgvector:pg16
    environment: 
      POSTGRES_USER: ${DB_USERNAME} 
      POSTGRES_PASSWORD: ${DB_PASSWORD} 
      POSTGRES_DB: ${DB_NAME} 
    ports: 
      - '${DB_PORT}:${DB_PORT}'
    volumes: 
      - pgdata:/var/lib/postgresql/data

volumes:
  api:
  pgdata:
  models: