
services:
  api:
    container_name: APIService
    build: ./api
    ports:
      - 80:80
    volumes:
      - ./api:/api

  db:
    container_name: "PGVector"
    image: pgvector/pgvector:pg16
    environment: 
      POSTGRES_USER: dashboard 
      POSTGRES_PASSWORD: dashboard 
      POSTGRES_DB: dashboard 
    ports: 
      - "5432:5432" 
    volumes: 
      - pgdata:/var/lib/postgresql/data

volumes:
  api:
  pgdata: